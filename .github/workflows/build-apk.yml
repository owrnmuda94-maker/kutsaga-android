name: Build Kutsaga Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Bundle JS dependencies locally (offline support)
        run: |
          mkdir -p www/js
          curl -L "https://unpkg.com/react@18/umd/react.production.min.js" -o www/js/react.production.min.js
          curl -L "https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" -o www/js/react-dom.production.min.js
          curl -L "https://unpkg.com/@babel/standalone/babel.min.js" -o www/js/babel.min.js
          curl -L "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" -o www/js/jspdf.umd.min.js
          echo "Bundled $(du -sh www/js | cut -f1) of JS dependencies"

      - name: Add Android platform
        run: npx cap add android

      - name: Add permissions to AndroidManifest
        run: |
          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()

          permissions = '''
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
              <uses-feature android:name=\"android.hardware.location.gps\" android:required=\"false\" />'''

          content = content.replace(
              '<uses-permission android:name=\"android.permission.INTERNET\" />',
              '<uses-permission android:name=\"android.permission.INTERNET\" />' + permissions
          )

          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(content)
          print('Permissions added successfully')
          "

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kutsaga-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
